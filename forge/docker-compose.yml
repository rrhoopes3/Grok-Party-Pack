services:
  forge:
    build: .
    ports:
      - "5000:5000"
    env_file:
      - .env
    volumes:
      - .:/app
      - ./data:/app/data
    environment:
      - PYTHONPATH=/app
    command: sh -c "cd /app && PYTHONPATH=. python app.py"
    stdin_open: true
    tty: true
    restart: unless-stopped
